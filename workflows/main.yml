name: ACEest CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build and lint (compile Python sources)
        run: python -m compileall -q app.py services.py tests

      - name: Run unit tests on the runner
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Build production Docker image
        run: docker build --target runtime --tag aceest-fitness:${{ github.sha }} .

      - name: Build test stage and execute pytest inside the container
        run: docker build --target test --tag aceest-fitness-test:${{ github.sha }} .

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
