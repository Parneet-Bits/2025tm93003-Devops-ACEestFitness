apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-blue-green
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    version: blue
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
      nodePort: 30081
