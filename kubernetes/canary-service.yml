apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-stable
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
spec:
  selector:
    app: aceest-fitness
    version: blue
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-canary
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
spec:
  selector:
    app: aceest-fitness
    version: green
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
